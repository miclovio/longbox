<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Reader — Longbox</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    html, body {
      background: #000;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-x pan-y;
    }

    /* ---- Top Bar ---- */
    .reader-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      padding: 0 1rem;
      gap: 0.75rem;
      z-index: 50;
      transition: transform 0.3s ease;
    }

    .reader-bar.hidden { transform: translateY(-100%); }

    .reader-bar .back-btn {
      color: var(--text-secondary);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0.25rem;
      text-decoration: none;
      line-height: 1;
    }

    .reader-bar .back-btn:hover { color: var(--accent); }

    .reader-bar .title {
      flex: 1;
      font-size: 0.85rem;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reader-bar .title span {
      color: var(--text-muted);
      margin-left: 0.5rem;
    }

    .reader-bar .page-info {
      font-size: 0.8rem;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .reader-bar .bar-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.5rem;
      min-width: 44px;
      min-height: 44px;
      border-radius: 4px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reader-bar .bar-btn:hover { color: var(--accent); background: rgba(255,255,255,0.05); }
    .reader-bar .bar-btn.active { color: var(--accent); }

    /* ---- Page Display ---- */
    .reader-viewport {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }

    .reader-viewport img {
      display: block;
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      transition: opacity 0.15s;
    }

    .reader-viewport img.fit-width {
      max-width: 100%;
      max-height: none;
      width: 100%;
      height: auto;
    }

    .reader-viewport img.fit-height {
      max-width: none;
      max-height: 100vh;
      width: auto;
      height: 100vh;
    }

    .reader-viewport img.fit-original {
      max-width: none;
      max-height: none;
      width: auto;
      height: auto;
    }

    /* ---- Click Zones ---- */
    .click-zone {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 10%;
      z-index: 10;
      cursor: pointer;
    }

    .click-zone.left { left: 0; }
    .click-zone.right { right: 0; }
    .click-zone.center {
      left: 10%;
      width: 80%;
      cursor: default;
    }

    /* ---- Bottom Bar / Progress ---- */
    .reader-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1rem;
      z-index: 50;
      transition: transform 0.3s ease;
    }

    .reader-bottom.hidden { transform: translateY(100%); }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      margin-bottom: 0.5rem;
    }

    .progress-track::before {
      content: '';
      position: absolute;
      top: -18px;
      bottom: -18px;
      left: 0;
      right: 0;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.2s;
    }

    .progress-track:hover .progress-fill { height: 6px; margin-top: -1px; }

    .bottom-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-primary);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .nav-btn:hover { background: rgba(255, 255, 255, 0.15); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .page-counter {
      font-size: 0.85rem;
      color: var(--text-secondary);
      min-width: 80px;
      text-align: center;
      cursor: pointer;
    }

    .page-counter:hover { color: var(--accent); }

    /* ---- Settings Panel ---- */
    .settings-panel {
      position: fixed;
      top: 48px;
      right: 0;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 0 0 0 8px;
      padding: 1rem;
      z-index: 60;
      min-width: 200px;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }

    .settings-panel.visible { transform: translateX(0); }

    .settings-panel h4 {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }

    .settings-panel .setting-group {
      margin-bottom: 1rem;
    }

    .setting-btn {
      display: block;
      width: 100%;
      padding: 0.45rem 0.75rem;
      border: none;
      border-radius: 4px;
      background: none;
      color: var(--text-secondary);
      font-size: 0.82rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      font-family: inherit;
    }

    .setting-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
    .setting-btn.active { color: var(--accent); background: var(--accent-dim); }

    /* ---- Go To Page Dialog ---- */
    .goto-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .goto-overlay.visible { display: flex; }

    .goto-dialog {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      min-width: 250px;
    }

    .goto-dialog h3 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .goto-dialog input {
      width: 100%;
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      font-size: 1.2rem;
      text-align: center;
      outline: none;
    }

    .goto-dialog input:focus { box-shadow: 0 0 0 2px var(--accent); }

    .goto-dialog .hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    /* ---- Page Thumbnails Strip ---- */
    .thumb-strip {
      display: flex;
      gap: 4px;
      padding: 0.5rem 0;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }

    .thumb-strip img {
      height: 60px;
      width: auto;
      border-radius: 2px;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .thumb-strip img:hover { opacity: 0.8; }
    .thumb-strip img.active { opacity: 1; outline: 2px solid var(--accent); }

    /* ---- Loading ---- */
    .reader-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    /* ---- Bookmark Toast ---- */
    .bookmark-toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--color-success);
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 24px;
      font-size: 0.82rem;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .bookmark-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .bookmark-toast.error {
      background: var(--color-danger);
    }

    /* ---- List Dropdown ---- */
    .list-dropdown {
      position: absolute;
      top: 48px;
      right: 40px;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 0 0 8px 8px;
      padding: 0.5rem 0;
      min-width: 200px;
      max-height: 280px;
      overflow-y: auto;
      z-index: 60;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .list-dropdown.visible { display: block; }

    .list-dropdown .ld-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.4rem 0.75rem;
    }

    .list-dropdown .ld-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text-secondary);
      transition: background 0.15s;
    }

    .list-dropdown .ld-item:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }

    .list-dropdown .ld-item input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .list-dropdown .ld-item label {
      cursor: pointer;
      flex: 1;
    }

    /* ---- Mobile ---- */
    @media (max-width: 768px) {
      .click-zone.left, .click-zone.right { width: 10%; }
      .click-zone.center { left: 10%; width: 80%; }
      .reader-bar { padding: 0 0.5rem; }
      .reader-bar .title { font-size: 0.75rem; }
      .settings-panel { min-width: 180px; }
      .nav-btn { width: 36px; height: 36px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="reader-bar" id="topBar">
    <a class="back-btn" id="backBtn" title="Back" aria-label="Back to series">&#8592;</a>
    <div class="title" id="readerTitle">Loading...</div>
    <span class="page-info" id="pageInfo"></span>
    <button class="bar-btn" id="zoomModeBtn" title="Zoom Mode" aria-label="Zoom mode">&#8853;</button>
    <button class="bar-btn" id="bookmarkBtn" title="Bookmark this page" aria-label="Bookmark this page">&#9734;</button>
    <button class="bar-btn" id="listBtn" title="Add to list" aria-label="Add to list" style="position:relative;">&#9776;</button>
    <button class="bar-btn" id="settingsBtn" title="Settings" aria-label="Settings">&#9881;</button>
  </div>

  <!-- Page Display -->
  <div class="reader-viewport" id="viewport">
    <img id="pageImg" alt="Comic page">
  </div>

  <!-- Click Zones -->
  <div class="click-zone left" id="zonePrev"></div>
  <div class="click-zone center" id="zoneToggle"></div>
  <div class="click-zone right" id="zoneNext"></div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settingsPanel" role="dialog" aria-modal="true" aria-label="Reader settings">
    <div class="setting-group">
      <h4>Fit Mode</h4>
      <button class="setting-btn active" data-fit="contain">Fit to Screen</button>
      <button class="setting-btn" data-fit="fit-width">Fit to Width</button>
      <button class="setting-btn" data-fit="fit-height">Fit to Height</button>
      <button class="setting-btn" data-fit="fit-original">Original Size</button>
    </div>
    <div class="setting-group">
      <h4>Shortcuts</h4>
      <div style="font-size:0.75rem;color:var(--text-muted);line-height:1.8;">
        <div><kbd style="color:var(--text-secondary);">&#8592; &#8594;</kbd> Previous / Next</div>
        <div><kbd style="color:var(--text-secondary);">Space</kbd> Next page</div>
        <div><kbd style="color:var(--text-secondary);">G</kbd> Go to page</div>
        <div><kbd style="color:var(--text-secondary);">F</kbd> Cycle fit mode</div>
        <div><kbd style="color:var(--text-secondary);">B</kbd> Bookmark page</div>
        <div><kbd style="color:var(--text-secondary);">M</kbd> Toggle UI</div>
        <div><kbd style="color:var(--text-secondary);">Esc</kbd> Close / Back</div>
      </div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="reader-bottom" id="bottomBar">
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="bottom-controls">
      <button class="nav-btn" id="btnFirst" title="First page" aria-label="First page">&#171;</button>
      <button class="nav-btn" id="btnPrev" title="Previous page" aria-label="Previous page">&#8249;</button>
      <div class="page-counter" id="pageCounter" title="Go to page..." aria-label="Go to page" role="button" tabindex="0">1 / 1</div>
      <button class="nav-btn" id="btnNext" title="Next page" aria-label="Next page">&#8250;</button>
      <button class="nav-btn" id="btnLast" title="Last page" aria-label="Last page">&#187;</button>
    </div>
  </div>

  <!-- Go To Page Dialog -->
  <div class="goto-overlay" id="gotoOverlay" role="dialog" aria-modal="true" aria-label="Go to page">
    <div class="goto-dialog">
      <h3>Go to Page</h3>
      <input type="number" id="gotoInput" min="1" placeholder="Page #" aria-label="Page number">
      <div class="hint" id="gotoHint">Press Enter to jump</div>
    </div>
  </div>

  <!-- List Dropdown -->
  <div class="list-dropdown" id="listDropdown"></div>

  <!-- Bookmark Toast -->
  <div class="bookmark-toast" id="bookmarkToast"></div>

  <!-- Loading -->
  <div class="reader-loading" id="loading">
    <div class="spinner" style="width:40px;height:40px;border-width:3px;"></div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    var zoomModeOn = false;

    const issueId = getParam('id');
    let issue = null;
    let pageCount = 0;
    let currentPage = 0;
    let fitMode = 'contain'; // contain, fit-width, fit-height, fit-original
    let uiVisible = true;
    let nextIssueId = null;
    let prevIssueId = null;

    // Cache for preloaded images
    const imageCache = new Map();

    // ---- Init ----
    async function init() {
      if (!issueId) { window.location.href = '/'; return; }

      // Load issue info
      const res = await fetch(`/api/issues/${issueId}`);
      if (!res.ok) { window.location.href = '/'; return; }
      issue = await res.json();

      document.title = `${issue.title} — Longbox`;
      document.getElementById('readerTitle').innerHTML =
        `${esc(issue.series_name)} <span>${esc(issue.title)}</span>`;
      document.getElementById('backBtn').href = `/series.html?id=${issue.series_id}`;

      // Get page count
      const pagesRes = await fetch(`/api/issues/${issueId}/pages`);
      const pagesData = await pagesRes.json();
      pageCount = pagesData.page_count;

      // Load adjacent issues for next/prev issue navigation
      loadAdjacentIssues();

      // Start at page from URL param, saved progress, or page 0
      const urlPage = getParam('page');
      if (urlPage != null) {
        currentPage = parseInt(urlPage, 10);
      } else {
        const savedPage = localStorage.getItem(`progress_${issueId}`);
        currentPage = savedPage ? parseInt(savedPage, 10) : 0;
      }
      if (currentPage >= pageCount || currentPage < 0) currentPage = 0;

      document.getElementById('gotoInput').max = pageCount;
      document.getElementById('gotoHint').textContent = `1 — ${pageCount}. Press Enter to jump.`;

      loadPage(currentPage);

      // Load bookmarks for this issue
      loadBookmarks();
    }

    async function loadAdjacentIssues() {
      const seriesRes = await fetch(`/api/series/${issue.series_id}`);
      const seriesData = await seriesRes.json();
      const issues = seriesData.issues || [];

      // Find current issue index (check variants too)
      let idx = -1;
      for (let i = 0; i < issues.length; i++) {
        if (issues[i].id == issueId) { idx = i; break; }
        if (issues[i].variants) {
          for (const v of issues[i].variants) {
            if (v.id == issueId) { idx = i; break; }
          }
        }
        if (idx >= 0) break;
      }

      if (idx > 0) prevIssueId = issues[idx - 1].id;
      if (idx < issues.length - 1) nextIssueId = issues[idx + 1].id;
    }

    // ---- Page Loading ----
    function pageUrl(page) {
      return `/api/issues/${issueId}/pages/${page}`;
    }

    function preloadPage(page) {
      if (page < 0 || page >= pageCount || imageCache.has(page)) return;
      const img = new Image();
      img.src = pageUrl(page);
      imageCache.set(page, img);
    }

    function loadPage(page) {
      if (page < 0 || page >= pageCount) return;
      currentPage = page;

      const img = document.getElementById('pageImg');
      const loading = document.getElementById('loading');

      // Show loading if not cached
      if (!imageCache.has(page) || !imageCache.get(page).complete) {
        loading.style.display = 'flex';
      }

      const url = pageUrl(page);
      img.onload = () => {
        loading.style.display = 'none';
        applyFitMode();
      };
      img.onerror = () => {
        loading.style.display = 'none';
        showToast('Couldn\'t load page ' + (page + 1) + '. The archive may be corrupt or unsupported.', true);
      };
      img.src = url;
      imageCache.set(page, img);

      // Update UI
      updateUI();
      saveProgress();

      // Preload adjacent pages
      preloadPage(page + 1);
      preloadPage(page + 2);
      preloadPage(page - 1);

      // Scroll to top for fit-width mode
      document.getElementById('viewport').scrollTop = 0;
    }

    function updateUI() {
      const display = `${currentPage + 1} / ${pageCount}`;
      document.getElementById('pageCounter').textContent = display;
      document.getElementById('pageInfo').textContent = display;

      const pct = pageCount > 1 ? (currentPage / (pageCount - 1)) * 100 : 100;
      document.getElementById('progressFill').style.width = pct + '%';

      document.getElementById('btnPrev').disabled = currentPage === 0;
      document.getElementById('btnFirst').disabled = currentPage === 0;
      document.getElementById('btnNext').disabled = currentPage >= pageCount - 1;
      document.getElementById('btnLast').disabled = currentPage >= pageCount - 1;
    }

    const saveProgressDebounced = debounce(() => {
      const isRead = currentPage >= pageCount - 1;
      fetch(`/api/progress/${issueId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_page: currentPage, is_read: isRead }),
      }).catch(() => {});
    }, 1000);

    function saveProgress() {
      localStorage.setItem(`progress_${issueId}`, currentPage);
      saveProgressDebounced();
    }

    // ---- Navigation ----
    let _seriesEndShown = false;
    function goNext() {
      if (currentPage < pageCount - 1) {
        loadPage(currentPage + 1);
      } else if (nextIssueId) {
        window.location.href = `/reader.html?id=${nextIssueId}`;
      } else if (!_seriesEndShown) {
        _seriesEndShown = true;
        var toast = document.getElementById('bookmarkToast');
        toast.textContent = 'You finished ' + (issue.series_name || 'this series') + '.';
        toast.className = 'bookmark-toast visible';
        setTimeout(function() { toast.classList.remove('visible'); }, 4000);
      }
    }

    function goPrev() {
      if (currentPage > 0) {
        loadPage(currentPage - 1);
      } else if (prevIssueId) {
        window.location.href = `/reader.html?id=${prevIssueId}`;
      }
    }

    function goFirst() { loadPage(0); }
    function goLast() { loadPage(pageCount - 1); }

    function goToPage(num) {
      const p = parseInt(num, 10) - 1;
      if (p >= 0 && p < pageCount) loadPage(p);
    }

    // ---- Fit Mode ----
    const fitModes = ['contain', 'fit-width', 'fit-height', 'fit-original'];

    function applyFitMode() {
      const img = document.getElementById('pageImg');
      img.className = fitMode === 'contain' ? '' : fitMode;

      // Allow scrolling in fit-width/original modes
      const vp = document.getElementById('viewport');
      vp.style.overflow = (fitMode === 'fit-width' || fitMode === 'fit-original') ? 'auto' : 'hidden';

      // Update settings buttons
      document.querySelectorAll('[data-fit]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.fit === fitMode);
      });
    }

    function cycleFitMode() {
      const idx = fitModes.indexOf(fitMode);
      fitMode = fitModes[(idx + 1) % fitModes.length];
      applyFitMode();
    }

    // ---- UI Toggle ----
    function toggleUI() {
      uiVisible = !uiVisible;
      document.getElementById('topBar').classList.toggle('hidden', !uiVisible);
      document.getElementById('bottomBar').classList.toggle('hidden', !uiVisible);
      if (!uiVisible) {
        if (window._settingsTrap) { window._settingsTrap(); window._settingsTrap = null; }
        document.getElementById('settingsPanel').classList.remove('visible');
      }
    }

    // ---- Go To Page Dialog ----
    function showGotoDialog() {
      const overlay = document.getElementById('gotoOverlay');
      const input = document.getElementById('gotoInput');
      overlay.classList.add('visible');
      window._gotoTrap = trapFocus(document.getElementById('gotoOverlay'));
      input.value = '';
      input.focus();
    }

    function hideGotoDialog() {
      if (window._gotoTrap) { window._gotoTrap(); window._gotoTrap = null; }
      document.getElementById('gotoOverlay').classList.remove('visible');
    }

    // ---- Progress Bar Click ----
    document.getElementById('progressTrack').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      const page = Math.round(pct * (pageCount - 1));
      loadPage(page);
    });

    // ---- Button Events ----
    document.getElementById('btnNext').addEventListener('click', goNext);
    document.getElementById('btnPrev').addEventListener('click', goPrev);
    document.getElementById('btnFirst').addEventListener('click', goFirst);
    document.getElementById('btnLast').addEventListener('click', goLast);
    document.getElementById('pageCounter').addEventListener('click', showGotoDialog);

    // Click zones
    document.getElementById('zonePrev').addEventListener('click', goPrev);
    document.getElementById('zoneNext').addEventListener('click', goNext);
    document.getElementById('zoneToggle').addEventListener('click', toggleUI);

    // Settings
    document.getElementById('settingsBtn').addEventListener('click', () => {
      const panel = document.getElementById('settingsPanel');
      const opening = !panel.classList.contains('visible');
      panel.classList.toggle('visible');
      if (opening) {
        window._settingsTrap = trapFocus(panel);
      } else {
        if (window._settingsTrap) { window._settingsTrap(); window._settingsTrap = null; }
      }
    });

    document.querySelectorAll('[data-fit]').forEach(btn => {
      btn.addEventListener('click', () => {
        fitMode = btn.dataset.fit;
        applyFitMode();
      });
    });

    // Go to page dialog
    document.getElementById('gotoInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        goToPage(e.target.value);
        hideGotoDialog();
      } else if (e.key === 'Escape') {
        hideGotoDialog();
      }
    });

    document.getElementById('gotoOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) hideGotoDialog();
    });

    // ---- Bookmark ----
    let bookmarkedPages = new Set();

    async function loadBookmarks() {
      try {
        const res = await fetch('/api/bookmarks');
        const bookmarks = await res.json();
        bookmarkedPages = new Set(
          bookmarks.filter(b => b.issue_id == issueId).map(b => b.page_number)
        );
        updateBookmarkBtn();
      } catch (e) { /* ignore */ }
    }

    function updateBookmarkBtn() {
      const btn = document.getElementById('bookmarkBtn');
      if (bookmarkedPages.has(currentPage)) {
        btn.innerHTML = '&#9733;'; // filled star
        btn.classList.add('active');
        btn.title = 'Remove bookmark';
      } else {
        btn.innerHTML = '&#9734;'; // empty star
        btn.classList.remove('active');
        btn.title = 'Bookmark this page';
      }
    }

    function showToast(msg, isError) {
      const toast = document.getElementById('bookmarkToast');
      toast.textContent = msg;
      toast.classList.toggle('error', !!isError);
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2000);
    }

    document.getElementById('bookmarkBtn').addEventListener('click', async () => {
      if (bookmarkedPages.has(currentPage)) {
        // Remove bookmark — need to find its id
        try {
          const res = await fetch('/api/bookmarks');
          const bookmarks = await res.json();
          const match = bookmarks.find(b => b.issue_id == issueId && b.page_number === currentPage);
          if (match) {
            await fetch(`/api/bookmarks/${match.id}`, { method: 'DELETE' });
            bookmarkedPages.delete(currentPage);
            updateBookmarkBtn();
            showToast('Bookmark removed');
          }
        } catch (e) {
          showToast('Failed to remove bookmark', true);
        }
      } else {
        // Add bookmark
        try {
          await fetch('/api/bookmarks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ issue_id: parseInt(issueId), page_number: currentPage }),
          });
          bookmarkedPages.add(currentPage);
          updateBookmarkBtn();
          showToast(`Bookmarked page ${currentPage + 1}`);
        } catch (e) {
          showToast('Failed to add bookmark', true);
        }
      }
    });

    // Update bookmark button when page changes
    const _originalUpdateUI = updateUI;
    updateUI = function() {
      _originalUpdateUI();
      updateBookmarkBtn();
    };

    // ---- Keyboard Shortcuts ----
    document.addEventListener('keydown', (e) => {
      // Ignore if typing in an input
      if (e.target.tagName === 'INPUT') return;

      switch (e.key) {
        case 'ArrowRight':
        case 'ArrowDown':
          e.preventDefault();
          goNext();
          break;
        case 'ArrowLeft':
        case 'ArrowUp':
          e.preventDefault();
          goPrev();
          break;
        case ' ':
          e.preventDefault();
          goNext();
          break;
        case 'Home':
          e.preventDefault();
          goFirst();
          break;
        case 'End':
          e.preventDefault();
          goLast();
          break;
        case 'g':
          showGotoDialog();
          break;
        case 'f':
          cycleFitMode();
          break;
        case 'b':
          document.getElementById('bookmarkBtn').click();
          break;
        case 'm':
          toggleUI();
          break;
        case 'Escape':
          if (document.getElementById('gotoOverlay').classList.contains('visible')) {
            hideGotoDialog();
          } else if (document.getElementById('settingsPanel').classList.contains('visible')) {
            if (window._settingsTrap) { window._settingsTrap(); window._settingsTrap = null; }
            document.getElementById('settingsPanel').classList.remove('visible');
          } else {
            window.location.href = `/series.html?id=${issue.series_id}`;
          }
          break;
      }
    });

    // ---- Touch Swipe ----
    let touchStartX = 0;
    let touchStartY = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (zoomModeOn) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      // Only trigger on horizontal swipes (not vertical scroll)
      if (Math.abs(dx) > 100 && Math.abs(dx) > Math.abs(dy) * 2) {
        if (dx < 0) goNext();
        else goPrev();
      }
    }, { passive: true });

    // ---- Add to List ----
    let _readerLists = null;

    document.getElementById('listBtn').addEventListener('click', async () => {
      const dropdown = document.getElementById('listDropdown');

      if (dropdown.classList.contains('visible')) {
        dropdown.classList.remove('visible');
        return;
      }

      // Load lists
      try {
        const res = await fetch('/api/lists');
        _readerLists = await res.json();
      } catch (e) {
        _readerLists = [];
      }

      // Check membership for current issue
      const membership = new Set();
      for (const list of _readerLists) {
        try {
          const res = await fetch(`/api/lists/${list.id}`);
          const data = await res.json();
          if (data.items && data.items.some(i => i.issue_id == issueId)) {
            membership.add(list.id);
          }
        } catch (e) {}
      }

      dropdown.innerHTML = `
        <div class="ld-title">Add to List</div>
        ${_readerLists.map(l => `
          <div class="ld-item">
            <input type="checkbox" id="ld-cb-${l.id}" data-list-id="${l.id}" ${membership.has(l.id) ? 'checked' : ''}>
            <label for="ld-cb-${l.id}">${esc(l.name)}</label>
          </div>
        `).join('')}
        ${_readerLists.length === 0 ? '<div class="ld-item" style="color:var(--text-muted);font-size:0.78rem;">No lists yet. Create one on the Lists page.</div>' : ''}
      `;

      dropdown.classList.add('visible');

      // Handle checkbox changes
      dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', async () => {
          const listId = parseInt(cb.dataset.listId);
          if (cb.checked) {
            const r = await fetch(`/api/lists/${listId}/items`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ issue_id: parseInt(issueId) }),
            });
            if (r.ok) showToast('Added to list');
            else {
              const d = await r.json();
              if (d.error === 'Issue already in list') showToast('Already in list');
              else showToast('Failed to add', true);
            }
          } else {
            await fetch(`/api/lists/${listId}/items/${issueId}`, { method: 'DELETE' });
            showToast('Removed from list');
          }
        });
      });
    });

    // Close list dropdown on outside click
    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('listDropdown');
      const listBtn = document.getElementById('listBtn');
      if (!dropdown.contains(e.target) && e.target !== listBtn) {
        dropdown.classList.remove('visible');
      }
    });

    // ---- Zoom Mode ----
    document.getElementById('zoomModeBtn').addEventListener('click', function() {
      zoomModeOn = !zoomModeOn;
      var btn = document.getElementById('zoomModeBtn');
      var img = document.getElementById('pageImg');
      var vp = document.getElementById('viewport');
      var zones = document.querySelectorAll('.click-zone');

      btn.classList.toggle('active', zoomModeOn);
      showToast(zoomModeOn ? 'Zoom mode on — pinch and scroll' : 'Zoom mode off');

      if (zoomModeOn) {
        // Enable pinch zoom + scroll
        document.documentElement.style.touchAction = 'auto';
        document.body.style.touchAction = 'auto';
        vp.style.touchAction = 'auto';
        // Hide click zones
        for (var i = 0; i < zones.length; i++) zones[i].style.display = 'none';
        // Fit width so page is readable and scrollable
        img.className = 'fit-width';
        vp.style.overflow = 'auto';
      } else {
        // Disable pinch zoom
        document.documentElement.style.touchAction = 'pan-x pan-y';
        document.body.style.touchAction = 'pan-x pan-y';
        vp.style.touchAction = '';
        // Restore click zones
        for (var i = 0; i < zones.length; i++) zones[i].style.display = '';
        // Restore normal fit mode
        applyFitMode();
      }
    });

    // ---- Start ----
    init();
  </script>
</body>
</html>
